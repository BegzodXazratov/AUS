<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolalar uchun interyer dizayn kursi | AUS ACADEMY</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040914;
            --card-bg: rgba(10, 22, 38, 0.9);
            --primary-orange: #C94B32;
            --text-main: #FFFFFF;
            --text-muted: #8E9BAE;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Montserrat', sans-serif; padding: 20px;
        }

        .form-container {
            width: 100%; max-width: 500px; background: var(--card-bg);
            backdrop-filter: blur(20px); padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08); text-align: center;
        }

        .logo-box { width: 100px; height: 100px; margin: 0 auto 20px; }
        .logo-box img { max-width: 100%; height: auto; border-radius: 12px; }
        
        h1 { font-size: 14px; letter-spacing: 2px; color: var(--primary-orange); margin-bottom: 5px; }
        h2 { font-size: 22px; margin-bottom: 25px; color: white; }
        
        .step { display: none; }
        .step.active { display: block; }
        
        .option-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-label { padding: 16px; border: 1px solid #1E2D4A; border-radius: 12px; cursor: pointer; color: white; transition: 0.3s; text-align: left; }
        .option-label:hover, .option-label.selected { border-color: var(--primary-orange); background: rgba(201, 75, 50, 0.1); }
        
        input { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #1E2D4A; background: #0A1626; color: white; margin-bottom: 15px; font-size: 16px; }
        button { width: 100%; padding: 18px; background: var(--primary-orange); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        
        .thank-you { display: none; padding: 20px 0; }
        .thank-you.active { display: block; }
        .social-btn { display: block; width: 100%; padding: 15px; margin-top: 10px; border: 1px solid var(--primary-orange); border-radius: 12px; color: white; text-decoration: none; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="logo-box">
            <img src="logo.jpg" alt="AUS Logo" onerror="this.src='https://i.imgur.com/kZ4tYk2.png'">
        </div>
        <h1>AUS ACADEMY</h1>
        <h2>Bolalar uchun interyer dizayn kursi</h2>
        
        <div id="step-1" class="step active">
            <p style="margin-bottom:15px">Kursimiz Toshkent shahrida offline formatda bo'ladi, qatnab o'qiy olasizmi?</p>
            <div class="option-group">
                <label class="option-label" onclick="sel(this, 'toshkent', 'Ha')">Ha, qatnab o'qiy olaman</label>
                <label class="option-label" onclick="sel(this, 'toshkent', 'Yo\'q')">Yo'q, o'qiy olmayman</label>
            </div>
            <button onclick="next(2)" id="btn1" disabled>KEYINGISI</button>
        </div>

        <div id="step-2" class="step">
            <p style="margin-bottom:15px">Kurs kim uchun?</p>
            <div class="option-group">
                <label class="option-label" onclick="sel(this, 'kim', 'O\'zim')">O'zim uchun</label>
                <label class="option-label" onclick="sel(this, 'kim', 'Farzandim')">Farzandim uchun</label>
            </div>
            <button onclick="next(3)" id="btn2" disabled>KEYINGISI</button>
        </div>

        <div id="step-3" class="step">
            <input type="text" id="name" placeholder="Ismingiz">
            <input type="tel" id="phone" value="+998 ">
            <button onclick="submitLead()" id="submitBtn">RO'YXATDAN O'TISH</button>
        </div>

        <div id="step-4" class="thank-you">
            <h2 style="color:var(--success-green)">Rahmat!</h2>
            <p style="margin-bottom:20px; color:var(--text-muted)">Arizangiz qabul qilindi.</p>
            <a href="https://instagram.com" class="social-btn">Instagramga qaytish</a>
            <a href="https://t.me/AUS_admin1" class="social-btn">Telegram adminga yozish</a>
        </div>
    </div>

    <script>
        const entryTime = Date.now();
        let formData = { toshkent: '', kim: '' };

        function sel(el, key, val) {
            el.parentElement.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
            el.classList.add('selected');
            formData[key] = val;
            document.getElementById(key === 'toshkent' ? 'btn1' : 'btn2').disabled = false;
        }

        function next(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step-' + step).classList.add('active');
        }

        async function submitLead() {
            const time = Math.floor((Date.now() - entryTime) / 1000);
            const count = parseInt(localStorage.getItem('lc') || 0) + 1;
            const text = `🎯 <b>LID №${count}</b>\n👤 <b>Ism:</b> ${document.getElementById('name').value}\n📞 <b>Tel:</b> ${document.getElementById('phone').value}\n📍 <b>Toshkent:</b> ${formData.toshkent}\n👶 <b>Kim uchun:</b> ${formData.kim}\n⏱ <b>Vaqt:</b> ${time} soniya`;

            await fetch('https://api.telegram.org/bot8712814801:AAGxdtWzC9beYpRsy1N47MsfBW7Y9DbigXs/sendMessage', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: '-5318102071', text: text, parse_mode: 'HTML' })
            });
            localStorage.setItem('lc', count);
            next(4);
        }
    </script>
</body>
</html>
