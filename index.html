<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUS ACADEMY - Ro'yxatdan o'tish</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #040914;
            --card-bg: rgba(10, 22, 38, 0.95);
            --primary-orange: #C94B32;
            --text-main: #FFFFFF;
            --text-muted: #D0D8E8;
            --insta-color: #d62976;
        }

        body { background-color: var(--bg-dark); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Montserrat', sans-serif; padding: 20px; }
        .form-container { width: 100%; max-width: 500px; background: var(--card-bg); backdrop-filter: blur(20px); padding: 40px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.15); text-align: center; }
        
        .logo-box { width: 80px; height: 80px; margin: 0 auto 15px; }
        .logo-box img { max-width: 100%; height: auto; border-radius: 12px; }
        
        /* Rasmdan tepadagi yangi sarlavha */
        .top-title { font-size: 15px; color: var(--text-main); font-weight: 700; margin-bottom: 15px; line-height: 1.4; }

        .process-img { width: 100%; height: 190px; margin-bottom: 20px; border-radius: 16px; overflow: hidden; background: #0A1626; }
        .process-img img { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-size: 14px; letter-spacing: 2px; color: var(--primary-orange); margin-bottom: 20px; font-weight: 700; }
        
        .step { display: none; }
        .step.active { display: block; }
        
        .question-text { font-size: 18px; color: var(--text-main); margin-bottom: 25px; font-weight: 600; line-height: 1.4; }
        .option-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-label { padding: 16px; border: 1px solid #2A3F6D; border-radius: 12px; cursor: pointer; color: var(--text-main); background: rgba(255, 255, 255, 0.03); transition: 0.3s; text-align: left; font-weight: 500; }
        .option-label:hover, .option-label.selected { border-color: var(--primary-orange); background: rgba(201, 75, 50, 0.25); }
        
        input { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #2A3F6D; background: #0A1626; color: var(--text-main); margin-bottom: 15px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary-orange); }
        
        button { width: 100%; padding: 18px; background: var(--primary-orange); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover:not(:disabled) { background: #E0563B; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .reject-box h3 { font-size: 20px; color: #ff6b6b; margin-bottom: 15px; line-height: 1.5; font-weight: 700; }
        .social-btn { display: block; width: 100%; padding: 16px; margin-top: 20px; border-radius: 12px; color: white; text-decoration: none; font-weight: 600; background: var(--insta-color); transition: 0.3s; }
        .social-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="logo-box">
            <img src="logo.jpg" alt="AUS Logo" onerror="this.src='https://i.imgur.com/kZ4tYk2.png'">
        </div>
        
        <!-- Rasmdan tepadagi yangi yozuv -->
        <div class="top-title">Toshkent shahrida yashovchilar uchun<br>Arxitektura va Dizayn kursi</div>

        <div class="process-img">
            <img src="photo.webp" alt="Dars jarayoni" onerror="this.src='https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=800&auto=format&fit=crop'">
        </div>

        <h1>AUS ACADEMY</h1>
        
        <!-- 1-Step -->
        <div id="step-1" class="step active">
            <div class="question-text">Kursimiz Toshkent shahrida offline formatda bo'ladi, qatnab o'qiy olasizmi?</div>
            <div class="option-group">
                <label class="option-label" onclick="sel(this, 'toshkent', 'Ha')">Ha, qatnab o'qiy olaman</label>
                <label class="option-label" onclick="sel(this, 'toshkent', 'Yo\'q')">Yo'q, o'qiy olmayman</label>
            </div>
            <button onclick="checkFirstStep()" id="btn1" disabled>KEYINGISI</button>
        </div>

        <!-- Rad etish sahifasi -->
        <div id="step-reject" class="step reject-box">
            <h3>Uzr, darslarimiz offline formatda va siz Toshkent shahrida bo'lmasangiz o'qiy olmaysiz.</h3>
            <a href="https://instagram.com" class="social-btn" target="_blank">Ortga (Instagram)</a>
        </div>

        <!-- 2-Step (Yangilandi) -->
        <div id="step-2" class="step">
            <div class="question-text">Kurs kim uchun?</div>
            <div class="option-group">
                <label class="option-label" onclick="sel(this, 'kim', 'O\'zim')">O'zim uchun</label>
                <label class="option-label" onclick="sel(this, 'kim', 'Farzandim')">Farzandim uchun</label>
            </div>
            <button onclick="next(3)" id="btn2" disabled>KEYINGISI</button>
        </div>

        <!-- 3-Step (Telefon namunasi o'zgardi) -->
        <div id="step-3" class="step">
            <input type="text" id="name" placeholder="Ismingiz" oninput="validateInput()">
            <input type="tel" id="phone" value="+998331231323" oninput="formatPhone(event); validateInput()">
            <button onclick="submitLead()" id="submitBtn" disabled>RO'YXATDAN O'TISH</button>
        </div>
    </div>

    <script>
        const entryTime = Date.now();
        let formData = { toshkent: '', kim: '' };

        function sel(el, key, val) {
            el.parentElement.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
            el.classList.add('selected');
            formData[key] = val;
            if(key === 'toshkent') document.getElementById('btn1').disabled = false;
            if(key === 'kim') document.getElementById('btn2').disabled = false;
        }

        function checkFirstStep() {
            if (formData.toshkent === "Yo'q") {
                document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
                document.getElementById('step-reject').classList.add('active');
            } else {
                next(2);
            }
        }

        function next(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step-' + step).classList.add('active');
        }

        function formatPhone(e) {
            let input = e.target;
            let numbers = input.value.replace(/\D/g, '');
            if (!numbers.startsWith('998')) numbers = '998' + numbers;
            numbers = numbers.substring(0, 12);
            let formatted = '+998 ';
            if (numbers.length > 3) formatted += '(' + numbers.substring(3, 5);
            if (numbers.length >= 5) formatted += ') ' + numbers.substring(5, 8);
            if (numbers.length >= 8) formatted += '-' + numbers.substring(8, 10);
            if (numbers.length >= 10) formatted += '-' + numbers.substring(10, 12);
            input.value = formatted;
        }

        function validateInput() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.replace(/\D/g, '');
            const btn = document.getElementById('submitBtn');
            if (name.length >= 2 && phone.length === 12) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        async function submitLead() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'YUBORILMOQDA...';
            submitBtn.disabled = true;

            const time = Math.floor((Date.now() - entryTime) / 1000);
            const count = parseInt(localStorage.getItem('lc') || 0) + 1;
            const now = new Date();
            const dateStr = now.toLocaleDateString('uz-UZ');
            const timeStr = now.toLocaleTimeString('uz-UZ');

            const text = `🎯 <b>LID №${count}</b>\n\n👤 <b>Ism:</b> ${document.getElementById('name').value}\n📞 <b>Tel:</b> ${document.getElementById('phone').value}\n📍 <b>Toshkent:</b> ${formData.toshkent}\n👶 <b>Kim uchun:</b> ${formData.kim}\n📅 <b>Sana:</b> ${dateStr}\n🕒 <b>Soat:</b> ${timeStr}\n⏱ <b>Saytda bo'lgan vaqti:</b> ${time} soniya`;

            try {
                await fetch('https://api.telegram.org/bot8712814801:AAGxdtWzC9beYpRsy1N47MsfBW7Y9DbigXs/sendMessage', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: '-5318102071', text: text, parse_mode: 'HTML' })
                });
                localStorage.setItem('lc', count);
                window.location.href = 'thank.html';
            } catch (error) {
                alert("Xatolik yuz berdi. Qaytadan urinib ko'ring.");
                submitBtn.textContent = "RO'YXATDAN O'TISH";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
