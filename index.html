<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolalar uchun interyer dizayn kursi | AUS ACADEMY</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040914;
            --card-bg: rgba(10, 22, 38, 0.9);
            --primary-orange: #C94B32;
            --text-main: #FFFFFF;
            --text-muted: #8E9BAE;
            --success-green: #4CAF50;
        }

        body {
            background-color: var(--bg-dark);
            background-image: url('https://images.unsplash.com/photo-1606169997198-4663738cb20d?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center;
            background-attachment: fixed;
            box-shadow: inset 0 0 0 2000px rgba(4, 9, 20, 0.75);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Montserrat', sans-serif; padding: 20px;
        }

        /* 3D Minimalist Icons */
        .deco { position: absolute; font-size: 60px; opacity: 0.15; pointer-events: none; z-index: 0; }

        .form-container {
            width: 100%; max-width: 500px; background: var(--card-bg);
            backdrop-filter: blur(20px); padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center; position: relative; z-index: 1;
        }

        /* Logotip */
        .logo { width: 120px; margin-bottom: 15px; }
        
        h1 { font-size: 14px; letter-spacing: 2px; color: var(--primary-orange); text-transform: uppercase; margin-bottom: 10px; }
        h2 { font-size: 26px; margin-bottom: 30px; line-height: 1.3; color: white; }
        
        /* Progress Bar */
        .progress-bar { width: 100%; height: 4px; background: #1E2D4A; border-radius: 4px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-orange); width: 25%; transition: 0.3s; }

        .step { display: none; }
        .step.active { display: block; }
        
        .option-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-label { padding: 16px; border: 1px solid #1E2D4A; border-radius: 12px; cursor: pointer; color: white; transition: 0.3s; }
        .option-label:hover, .option-label.selected { border-color: var(--primary-orange); background: rgba(201, 75, 50, 0.1); }
        
        input { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #1E2D4A; background: #0A1626; color: white; margin-bottom: 15px; font-size: 16px; }
        button { width: 100%; padding: 18px; background: var(--primary-orange); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover:not(:disabled) { background: #E0563B; }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <div class="deco" style="top:10%; left:10%">🛋️</div>
    <div class="deco" style="bottom:10%; right:10%">✏️</div>

    <div class="form-container">
        <!-- Logo -->
        <img src="https://i.imgur.com/kZ4tYk2.png" class="logo" alt="AUS Logo">
        <h1>AUS ACADEMY</h1>
        <h2>Bolalar uchun interyer dizayn kursi</h2>
        
        <div class="progress-bar"><div class="progress-fill" id="pb"></div></div>

        <div id="step-1" class="step active">
            <div class="option-group">
                <label class="option-label" onclick="select(this, 1)">Ha, Toshkentdanman<input type="radio" name="loc" value="yes" style="display:none"></label>
                <label class="option-label" onclick="select(this, 1)">Yo'q, o'qiy olmayman<input type="radio" name="loc" value="no" style="display:none"></label>
            </div>
            <button id="b1" onclick="next(2)" disabled>KEYINGISI</button>
        </div>

        <div id="step-2" class="step">
            <input type="text" id="name" placeholder="Ismingiz">
            <input type="tel" id="phone" value="+998 ">
            <button onclick="submitLead()">RO'YXATDAN O'TISH</button>
        </div>
    </div>

    <script>
        const entryTime = Date.now();
        let current = 1;

        function select(el, step) {
            document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('b' + step).disabled = false;
        }

        function next(step) {
            document.getElementById('step-' + current).classList.remove('active');
            current = step;
            document.getElementById('step-' + current).classList.add('active');
            document.getElementById('pb').style.width = '100%';
        }

        async function submitLead() {
            const time = Math.floor((Date.now() - entryTime) / 1000);
            const count = parseInt(localStorage.getItem('lc') || 0) + 1;
            const text = `🎯 <b>LID №${count}</b>\n👤 <b>Ism:</b> ${document.getElementById('name').value}\n📞 <b>Tel:</b> ${document.getElementById('phone').value}\n⏱ <b>Vaqt:</b> ${time} soniya`;

            await fetch('https://api.telegram.org/bot8712814801:AAGxdtWzC9beYpRsy1N47MsfBW7Y9DbigXs/sendMessage', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: '-5318102071', text: text, parse_mode: 'HTML' })
            });
            localStorage.setItem('lc', count);
            alert("Rahmat!");
        }
    </script>
</body>
</html>
