<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolalar uchun interyer dizayn kursi | AUS ACADEMY</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040914;
            --card-bg: rgba(10, 22, 38, 0.9);
            --primary-orange: #C94B32;
            --text-main: #FFFFFF;
            --text-muted: #8E9BAE;
            --success-green: #4CAF50;
        }

        body {
            background-color: var(--bg-dark);
            background-image: url('https://images.unsplash.com/photo-1606169997198-4663738cb20d?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center;
            background-attachment: fixed;
            box-shadow: inset 0 0 0 2000px rgba(4, 9, 20, 0.75);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Montserrat', sans-serif; padding: 20px;
        }

        .deco { position: absolute; font-size: 60px; opacity: 0.15; pointer-events: none; z-index: 0; }
        
        .form-container {
            width: 100%; max-width: 500px; background: var(--card-bg);
            backdrop-filter: blur(20px); padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center; position: relative; z-index: 1;
        }

        /* GitHub-dagi .jpg rasm uchun joy */
        .logo-box { width: 100px; height: 100px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; }
        
        h1 { font-size: 14px; letter-spacing: 2px; color: var(--primary-orange); margin-bottom: 5px; }
        h2 { font-size: 22px; margin-bottom: 25px; color: white; }
        
        .step { display: none; }
        .step.active { display: block; }
        
        .option-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-label { padding: 16px; border: 1px solid #1E2D4A; border-radius: 12px; cursor: pointer; color: white; transition: 0.3s; text-align: left; }
        .option-label:hover, .option-label.selected { border-color: var(--primary-orange); background: rgba(201, 75, 50, 0.1); }
        
        input { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #1E2D4A; background: #0A1626; color: white; margin-bottom: 15px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary-orange); }
        
        button { width: 100%; padding: 18px; background: var(--primary-orange); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover:not(:disabled) { background: #E0563B; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .thank-you { display: none; padding: 20px 0; }
        .thank-you.active { display: block; }
        .success-icon { font-size: 50px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="deco" style="top:10%; left:10%">🛋️</div>
    <div class="deco" style="bottom:10%; right:10%">✏️</div>

    <div class="form-container">
        <!-- Logotip: logo.jpg (GitHub'ga yuklagan fayl nomingizga moslang) -->
        <div class="logo-box">
            <img src="logo.jpg" alt="AUS Logo" onerror="this.src='https://i.imgur.com/kZ4tYk2.png'">
        </div>
        
        <h1>AUS ACADEMY</h1>
        <h2>Bolalar uchun interyer dizayn kursi</h2>
        
        <!-- 1-savol: Toshkent -->
        <div id="step-1" class="step active">
            <div class="option-group">
                <label class="option-label" onclick="selectOpt(this, 'toshkent', 'Ha, Toshkent shahridanman')">1. Ha, Toshkent shahridanman</label>
                <label class="option-label" onclick="selectOpt(this, 'toshkent', 'Yo\'q, o\'qiy olmayman')">1. Yo'q, Toshkentda emasman</label>
            </div>
            <button onclick="nextStep(2)" id="btn1" disabled>KEYINGISI</button>
        </div>

        <!-- 2-savol: Kim uchun -->
        <div id="step-2" class="step">
            <div class="option-group">
                <label class="option-label" onclick="selectOpt(this, 'kim', 'O\'zim uchun')">2. O'zim uchun</label>
                <label class="option-label" onclick="selectOpt(this, 'kim', 'Farzandim uchun')">2. Farzandim uchun</label>
                <label class="option-label" onclick="selectOpt(this, 'kim', 'Boshqa maqsad')">2. Boshqa maqsad uchun</label>
            </div>
            <button onclick="nextStep(3)" id="btn2" disabled>KEYINGISI</button>
        </div>

        <!-- 3 va 4-savol: Ism va Telefon -->
        <div id="step-3" class="step">
            <input type="text" id="name" placeholder="3. Ismingizni kiriting" oninput="validateContact()">
            <input type="tel" id="phone" value="+998 " oninput="formatPhone(event); validateContact()">
            <button onclick="submitLead()" id="submitBtn" disabled>RO'YXATDAN O'TISH</button>
        </div>

        <!-- Thank You Page -->
        <div id="step-thanks" class="thank-you">
            <div class="success-icon">🎉</div>
            <h2 style="color: var(--success-green); margin-bottom: 10px;">Rahmat!</h2>
            <p style="color: var(--text-muted); line-height: 1.6;">Arizangiz muvaffaqiyatli qabul qilindi. Mutaxassisimiz tez orada siz bilan bog'lanadi.</p>
        </div>
    </div>

    <script>
        const entryTime = Date.now();
        let formData = { toshkent: '', kim: '' };

        function selectOpt(el, key, val) {
            el.parentElement.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
            el.classList.add('selected');
            formData[key] = val;
            
            if(key === 'toshkent') document.getElementById('btn1').disabled = false;
            if(key === 'kim') document.getElementById('btn2').disabled = false;
        }

        function nextStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step-' + step).classList.add('active');
        }

        function formatPhone(e) {
            let input = e.target;
            let numbers = input.value.replace(/\D/g, '');
            if (!numbers.startsWith('998')) numbers = '998' + numbers;
            numbers = numbers.substring(0, 12);
            let formatted = '+998 ';
            if (numbers.length > 3) formatted += '(' + numbers.substring(3, 5);
            if (numbers.length >= 5) formatted += ') ' + numbers.substring(5, 8);
            if (numbers.length >= 8) formatted += '-' + numbers.substring(8, 10);
            if (numbers.length >= 10) formatted += '-' + numbers.substring(10, 12);
            input.value = formatted;
        }

        function validateContact() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.replace(/\D/g, '');
            const btn = document.getElementById('submitBtn');
            
            if (name.length >= 2 && phone.length === 12) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        async function submitLead() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'YUBORILMOQDA...';
            submitBtn.disabled = true;

            const timeSpent = Math.floor((Date.now() - entryTime) / 1000);
            const leadCount = parseInt(localStorage.getItem('leadCounter') || 0) + 1;
            
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value;

            const text = `🎯 <b>YANGI LID №${leadCount}</b>\n\n` +
                         `👤 <b>Ism:</b> ${name}\n` +
                         `📞 <b>Tel:</b> ${phone}\n` +
                         `📍 <b>Toshkent:</b> ${formData.toshkent}\n` +
                         `👶 <b>Kim uchun:</b> ${formData.kim}\n` +
                         `⏱ <b>Saytda bo'lgan vaqti:</b> ${timeSpent} soniya`;

            const botToken = '8712814801:AAGxdtWzC9beYpRsy1N47MsfBW7Y9DbigXs';
            const chatId = '-5318102071';

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'HTML' })
                });
                
                localStorage.setItem('leadCounter', leadCount);
                
                document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
                document.getElementById('step-thanks').classList.add('active');

            } catch (error) {
                alert("Xatolik yuz berdi. Qaytadan urinib ko'ring.");
                submitBtn.textContent = "RO'YXATDAN O'TISH";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
