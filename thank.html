<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#041a31">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<title>AUS ACADEMY - Rahmat!</title>
<style>
:root{
  --navy:#072B4F;
  --navy-deep:#041a31;
  --orange:#EF4A27;
  --orange-btn:#D93A18;
  --ink:#ffffff;
  --muted:#b4c3d6;
  --line:rgba(255,255,255,.16);
  --glass:rgba(4,26,49,.72);
  --danger:#ff9d8c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);background:var(--navy-deep);
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden}
.bg img{width:100%;height:100%;object-fit:cover;filter:blur(16px) saturate(.9);transform:scale(1.12)}
.bg::after{content:'';position:absolute;inset:0;
  background:
    radial-gradient(110% 70% at 50% 0%,rgba(7,43,79,.55),rgba(4,26,49,.92) 75%),
    linear-gradient(180deg,rgba(7,43,79,.6),rgba(4,26,49,.88));}
.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.18;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 45%,transparent 30%,#000 100%);
  mask-image:radial-gradient(70% 60% at 50% 45%,transparent 30%,#000 100%);}
.card{width:100%;max-width:540px;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);
  border:1px solid var(--line);border-radius:20px;padding:18px 18px 26px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);}
.pad{padding:0 8px}

/* photo slot */
.photo{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.empty{border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;padding:16px}
.photo.empty img{display:none}
.photo.empty::after{content:'O\'quvchilar bilan surat joyi (photo.webp)'}

.brand{display:flex;align-items:flex-end;gap:14px;margin:-30px 8px 18px;position:relative}
.logo{width:72px;height:79px;flex:none;border-radius:14px;background:#fff;padding:4px;object-fit:contain;
  border:3px solid var(--navy-deep);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.brand h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:20px;line-height:1.1}
.brand p{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.35}

/* software logos */
.tools{margin:0 8px 22px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}
.tools small{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.tools ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.tool{width:52px;height:52px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;padding:7px;overflow:hidden}
.tool img{max-width:100%;max-height:100%;object-fit:contain}
.tool span{font-size:10px;font-weight:700;color:var(--navy);text-align:center;line-height:1.1}

/* progress */
.dim{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 8px 24px}
.dim div{position:relative;padding-top:14px;font-size:12px;color:var(--muted);transition:color .3s}
.dim div::before{content:'';position:absolute;left:0;right:0;top:4px;height:2px;background:var(--line);transition:background .4s}
.dim div::after{content:'';position:absolute;left:0;top:0;width:2px;height:10px;background:var(--line);transition:background .4s}
.dim div.on{color:var(--ink)}
.dim div.on::before,.dim div.on::after,.dim div.done::before,.dim div.done::after{background:var(--orange)}

.step{display:none;padding:0 8px}
.step.active{display:block;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.q{font-family:'Unbounded',sans-serif;font-weight:500;font-size:18px;line-height:1.35;margin-bottom:18px}

.choices{display:grid;gap:10px}
.choice{position:relative;display:block;cursor:pointer}
.choice input{position:absolute;opacity:0;inset:0;cursor:pointer}
.choice span{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:15px;font-weight:500;line-height:1.3;
  transition:border-color .2s,background .2s}
.choice span::before{content:'';flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);transition:all .2s}
.choice:hover span{border-color:rgba(239,74,39,.6)}
.choice input:checked + span{border-color:var(--orange);background:rgba(239,74,39,.14)}
.choice input:checked + span::before{border-color:var(--orange);background:var(--orange);box-shadow:inset 0 0 0 3px var(--navy-deep)}
.choice input:focus-visible + span{outline:2px solid #fff;outline-offset:2px}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.field input,.field textarea{width:100%;padding:14px 15px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:15px;outline:none;transition:border-color .2s,background .2s}
.field textarea{min-height:92px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--orange);background:rgba(255,255,255,.1)}
.field.err input{border-color:var(--danger)}
.field .msg{display:none;color:var(--danger);font-size:12px;margin-top:6px}
.field.err .msg{display:block}

.actions{display:flex;gap:10px;margin-top:22px}
.btn{font:inherit;font-weight:600;font-size:15px;cursor:pointer;padding:15px 22px;border-radius:12px;border:1px solid transparent;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;transition:transform .15s,background .2s,opacity .2s}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn-main{flex:1;background:var(--orange-btn);color:#fff}
.btn-main:hover{background:var(--orange);transform:translateY(-1px)}
.btn-main:disabled{opacity:.4;cursor:not-allowed;transform:none;background:var(--orange-btn)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}

.stop{display:none;padding:0 8px;animation:in .35s ease both}
.stop.active{display:block}
.stop h2{font-family:'Unbounded',sans-serif;font-weight:500;font-size:18px;line-height:1.4;margin-bottom:10px}
.stop p{color:var(--muted);font-size:14px;line-height:1.55}

.ok-mark{width:60px;height:60px;border-radius:50%;background:var(--orange-btn);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.ok-mark svg{width:30px;height:30px;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

@media (max-width:480px){.card{padding:14px 12px 22px;border-radius:18px}.q,.stop h2{font-size:16.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ok-mark svg{stroke-dashoffset:0}}
</style>
</head>

<script>
const INSTAGRAM_URL = "https://instagram.com";  // o'z Instagram havolangiz
const PIXEL_ID = "";   // Meta Pixel ID ni shu yerga yozing
function loadPixel(){
  if(!PIXEL_ID) return false;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('set','autoConfig',false,PIXEL_ID);   // Meta'ning "avtomatik" tugma/forma hodisalarini o'chiradi (ikki marta sanalishiga sabab bo'ladi)
  fbq('init',PIXEL_ID);
  fbq('track','PageView');
  return true;
}

document.querySelectorAll('[data-ig]').forEach(a=>a.href=INSTAGRAM_URL);

/* Lead FAQAT shu yerda va FAQAT bir marta sanaladi:

   - sahifa yangilansa yoki to'g'ridan-to'g'ri ochilsa hisoblanmaydi */
(function(){
  const id=sessionStorage.getItem('aus_pending_lead');
  if(!id){ loadPixel(); return; }          // faqat PageView
  sessionStorage.removeItem('aus_pending_lead');
  if(loadPixel() && window.fbq){ fbq('track','Lead',{},{eventID:id}); }
})();
</script>
